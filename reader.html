<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Computer Graphics Laboratory article reader."
      data-i18n-attr="content:reader.meta.description"
    >
    <title>Reader · Computer Graphics Laboratory</title>
    <link rel="icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]]
        },
        svg: {
          fontCache: "global"
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script defer src="assets/js/reader.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html#top" aria-label="Computer Graphics Laboratory home" data-i18n-attr="aria-label:brand.ariaLabel">
        <img src="assets/images/cgl-icon.png" alt="" class="brand-mark">
        <span class="brand-text">
          <span class="brand-title" data-i18n="brand.title">Computer Graphics Laboratory</span>
          <span class="brand-subtitle" data-i18n="brand.subtitle">Learning notes, algorithms, and resources</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html#top" data-i18n="nav.home">Home</a>
        <a href="articles.html" data-i18n="nav.articles">Learn</a>
        <a href="https://blog.cglab.top/" data-i18n="nav.blog">Blog</a>
        <a href="contribute.html" data-i18n="nav.contribute">Contribute</a>
        <a href="https://github.com/CGLaboratory" data-i18n="nav.github">Github</a>
      </nav>
      <div class="language-switcher" aria-label="Language selector" data-i18n-attr="aria-label:language.ariaLabel" data-render="languages"></div>
    </header>

    <main class="reader-main">
      <section class="reader-layout">
        <aside class="reader-sidebar">
          <a class="back-link" href="articles.html" data-i18n="reader.backToShelf">Back to shelf</a>
          <div class="reader-meta" data-render="reader-meta"></div>
          <nav class="notes-list chapter-list" aria-label="Chapters" data-i18n-attr="aria-label:articles.chaptersAriaLabel" data-render="chapter-list"></nav>
        </aside>
        <article class="markdown-panel reader-panel">
          <div id="reader-status" class="markdown-status" data-i18n="reader.status.loading">Loading article...</div>
          <div id="reader-content" class="markdown-content" aria-live="polite"></div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <img src="assets/images/cgl-logo.png" alt="Computer Graphics Lab logo">
      <p data-i18n="articles.footer">Computer Graphics Laboratory · Long-form graphics learning material.</p>
    </footer>
  </body>
</html>
