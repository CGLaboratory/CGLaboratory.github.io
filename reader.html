<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Learn</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const series = params.get("series");
      const chapter = params.get("chapter");
      let target = "learn/";

      if (series && chapter) {
        target = `learn/series/${encodeURIComponent(series)}/${encodeURIComponent(chapter)}`;
      } else if (series) {
        target = `learn/series/${encodeURIComponent(series)}/`;
      }

      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="learn/">Learn</a>...</p>
  </body>
</html>
